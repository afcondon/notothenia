package:
  name: minard-db
  description: "Minard-DB — schema cartography with Alloy-backed proofs"
  dependencies:
    - aff
    - argonaut-core
    - arrays
    - console
    - effect
    - either
    - foldable-traversable
    - foreign-object
    - httpurple
    - maybe
    - node-buffer
    - node-child-process
    - node-event-emitter
    - node-fs
    - node-path
    - node-process
    - node-streams
    - ordered-collections
    - parsing
    - posix-types
    - refs
    - prelude
    - routing-duplex
    - strings
    - tuples
  test:
    main: Test.Main
    dependencies: []
workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    httpurple:
      path: ../../purescript-httpurple-ws
    # yoga-postgres consumed from GitHub (harmonized deps PR #1, merged
    # 2026-05-30) rather than the registry — no publish needed. Pinned to
    # the merge commit so the build doesn't drift with upstream main.
    yoga-postgres:
      git: "https://github.com/rowtype-yoga/purescript-yoga-postgres.git"
      ref: "35e82506277b4c948939967b35ad8b1796b3541c"
